# CODMPanda production Worker — deploy from the main repository root.
name = "codmpanda-notify"
main = "worker.js"
compatibility_date = "2024-10-01"

# Daily notification at 19:00 UTC (20:00 Nigeria time).
[triggers]
crons = ["0 19 * * *"]

[observability]
enabled = true

# Configure these as Cloudflare Worker secrets; never commit secret values:
# FIREBASE_SERVICE_ACCOUNT_JSON
# GEMINI_API_KEY
# Optional if using OpenAI instead: OPENAI_API_KEY
#
# Cloudflare Workers Builds deploy command: npx wrangler deploy
# Do not use npx wrangler preview as the production deploy command.
