<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FF6B00" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CODMPanda" />
<meta name="description" content="The Ultimate CODM Companion — Find squads, track camos, share gunsmiths." />
<title>CODMPanda — The Ultimate CODM Companion</title>

<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
<link rel="apple-touch-icon" href="/icon-512.png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          amoled: '#050505',
          card: '#111111',
          cardAlt: '#181818',
          border: '#222222',
          primary: '#FF6B00',
          primaryDark: '#CC5500',
          gold: '#FFD700',
          goldDark: '#B8860B'
        },
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif']
        }
      }
    }
  };
</script>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }

  html, body {
    background: #050505;
    color: #ffffff;
    font-family: 'Inter', system-ui, sans-serif;
    overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
    scroll-behavior: smooth;
  }

  body {
    padding-bottom: calc(80px + var(--safe-bottom));
    min-height: 100vh;
  }

  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #FF6B00; }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  .glow-primary { box-shadow: 0 0 20px rgba(255, 107, 0, 0.4), 0 0 40px rgba(255, 107, 0, 0.15); }
  .glow-gold { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5), 0 0 40px rgba(255, 215, 0, 0.2); }
  .glow-text-primary { text-shadow: 0 0 12px rgba(255, 107, 0, 0.6); }
  .glow-text-gold { text-shadow: 0 0 12px rgba(255, 215, 0, 0.7); }

  .rank-legendary {
    background: linear-gradient(135deg, #FF6B00 0%, #FFD700 50%, #FF6B00 100%);
    background-size: 200% 200%;
    animation: legendaryShift 3s ease infinite;
  }
  @keyframes legendaryShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .skeleton {
    background: linear-gradient(90deg, #111 0%, #1a1a1a 50%, #111 100%);
    background-size: 200% 100%;
    animation: skeletonPulse 1.5s ease-in-out infinite;
  }
  @keyframes skeletonPulse {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  .fade-in { animation: fadeIn 0.3s ease-out; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .toast-enter { animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(-20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .toast-exit { animation: toastOut 0.25s ease-in forwards; }
  @keyframes toastOut {
    to { opacity: 0; transform: translateY(-20px) scale(0.95); }
  }

  .btn-press:active { transform: scale(0.96); }
  .btn-press { transition: transform 0.1s ease; }

  .bottom-nav {
    padding-bottom: var(--safe-bottom);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .top-bar {
    padding-top: var(--safe-top);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .modal-backdrop {
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  input, select, textarea {
    background: #111;
    border: 1px solid #222;
    color: #fff;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    width: 100%;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #FF6B00;
    box-shadow: 0 0 0 3px rgba(255, 107, 0, 0.15);
  }
  input::placeholder, textarea::placeholder { color: #555; }
  select {
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 18px;
    padding-right: 40px;
  }
  select option { background: #111; color: #fff; }

  input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    min-width: 22px;
    border-radius: 6px;
    border: 2px solid #333;
    background: #0a0a0a;
    cursor: pointer;
    position: relative;
    padding: 0;
    transition: all 0.2s;
  }
  input[type="checkbox"]:checked {
    background: #FF6B00;
    border-color: #FF6B00;
  }
  input[type="checkbox"]:checked::after {
    content: '';
    position: absolute;
    left: 6px;
    top: 2px;
    width: 5px;
    height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  .toggle {
    position: relative;
    width: 46px;
    height: 26px;
    background: #222;
    border-radius: 13px;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle.on { background: #FF6B00; }
  .toggle::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 20px;
    height: 20px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(20px); }

  input[type="range"] {
    -webkit-appearance: none;
    background: transparent;
    padding: 0;
    border: none;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 6px;
    background: #222;
    border-radius: 3px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 22px;
    width: 22px;
    border-radius: 50%;
    background: #FF6B00;
    margin-top: -8px;
    box-shadow: 0 0 12px rgba(255, 107, 0, 0.5);
    cursor: pointer;
  }

  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  .progress-bar {
    background: #1a1a1a;
    border-radius: 999px;
    overflow: hidden;
    height: 8px;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #FF6B00, #FFD700);
    border-radius: 999px;
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .ring-progress { transform: rotate(-90deg); }
  .ring-progress circle {
    transition: stroke-dashoffset 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .shimmer {
    background: linear-gradient(90deg, transparent 0%, rgba(255, 215, 0, 0.15) 50%, transparent 100%);
    background-size: 200% 100%;
    animation: shimmer 2.5s linear infinite;
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  .line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .line-clamp-3 {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .blurred { filter: blur(8px); pointer-events: none; user-select: none; }

  .tab-active { color: #FF6B00; }
  .tab-active .tab-icon { filter: drop-shadow(0 0 8px rgba(255, 107, 0, 0.6)); }

  .hidden { display: none !important; }

  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid #333;
    border-top-color: #FF6B00;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .chip {
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: #111;
    border: 1px solid #222;
    color: #888;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s;
  }
  .chip.active {
    background: #FF6B00;
    border-color: #FF6B00;
    color: #fff;
  }

  .sheet {
    border-top-left-radius: 24px;
    border-top-right-radius: 24px;
    background: #0a0a0a;
    border-top: 1px solid #222;
    max-height: 92vh;
    overflow-y: auto;
  }
</style>
</head>
<body class="bg-amoled">

<div id="app">

  <div id="splash" class="fixed inset-0 z-[100] bg-amoled flex flex-col items-center justify-center">
    <img src="/icon-512.png" alt="CODMPanda" class="w-24 h-24 rounded-3xl mb-4" style="box-shadow: 0 0 40px rgba(255, 107, 0, 0.5);" />
    <div class="text-4xl font-black tracking-tight">
      <span class="text-primary glow-text-primary">CODM</span><span class="text-white">Panda</span>
    </div>
    <div class="text-xs text-gray-500 mt-3 font-medium">Loading your companion...</div>
    <div class="spinner mt-6"></div>
  </div>

  <div id="onboarding" class="fixed inset-0 z-[90] bg-amoled hidden flex-col">
    <div id="onboarding-content" class="flex-1 flex flex-col"></div>
  </div>

  <div id="auth-gate" class="fixed inset-0 z-[85] bg-amoled hidden flex-col items-center justify-center p-6">
    <img src="/icon-512.png" alt="CODMPanda" class="w-24 h-24 rounded-3xl mb-6" style="box-shadow: 0 0 40px rgba(255, 107, 0, 0.5);" />
    <h1 class="text-4xl font-black text-center mb-2">
      <span class="text-primary glow-text-primary">CODM</span><span class="text-white">Panda</span>
    </h1>
    <p class="text-gray-400 text-center mb-10 text-sm max-w-xs">The Ultimate CODM Companion — find squads, track camos, build gunsmiths.</p>
    <button id="google-signin-btn" class="btn-press flex items-center gap-3 bg-white text-black font-bold px-6 py-4 rounded-2xl w-full max-w-xs shadow-lg">
      <svg width="22" height="22" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
      </svg>
      <span>Continue with Google</span>
    </button>
    <p class="text-xs text-gray-600 mt-8 text-center max-w-xs">
      By continuing, you agree to our Terms & Privacy Policy.
    </p>
  </div>

  <div id="main-app" class="hidden">
    <header id="top-bar" class="top-bar fixed top-0 left-0 right-0 z-40 bg-amoled/80 border-b border-border">
      <div class="flex items-center justify-between px-4 h-14">
        <div class="flex items-center gap-2">
          <img src="/icon-512.png" alt="CODMPanda" class="w-8 h-8 rounded-lg" />
          <div>
            <div class="text-base font-black leading-none">
              <span class="text-primary">CODM</span><span class="text-white">Panda</span>
            </div>
            <div id="top-bar-subtitle" class="text-[10px] text-gray-500 font-medium leading-none mt-0.5">Ready to dominate</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <div id="online-count" class="hidden items-center gap-1.5 px-2.5 py-1 rounded-full bg-card border border-border">
            <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
            <span class="text-[10px] font-semibold text-gray-300"><span id="online-num">0</span> online</span>
          </div>
          <button id="btn-notifications" class="btn-press w-9 h-9 rounded-full bg-card border border-border flex items-center justify-center">
            <i data-lucide="bell" class="w-4 h-4 text-gray-300"></i>
          </button>
        </div>
      </div>
    </header>

    <main id="content" class="pt-14 min-h-screen"></main>

    <div id="ad-banner" class="hidden fixed bottom-[72px] left-0 right-0 z-30 bg-card border-t border-border px-4 py-2">
      <div class="flex items-center justify-between">
        <span class="text-[10px] text-gray-500 font-medium">Sponsored</span>
        <div class="text-xs text-gray-400">Ad space — upgrade to Pro to remove</div>
        <button onclick="hideAd()" class="text-gray-500 text-xs">✕</button>
      </div>
    </div>

    <nav id="bottom-nav" class="bottom-nav fixed bottom-0 left-0 right-0 z-40 bg-amoled/95 border-t border-border">
      <div class="grid grid-cols-5 h-[72px]">
        <button data-tab="play" class="tab-btn flex flex-col items-center justify-center gap-1 tab-active">
          <i data-lucide="gamepad-2" class="tab-icon w-6 h-6"></i>
          <span class="text-[10px] font-bold">PLAY</span>
        </button>
        <button data-tab="lab" class="tab-btn flex flex-col items-center justify-center gap-1 text-gray-500">
          <i data-lucide="flask-conical" class="tab-icon w-6 h-6"></i>
          <span class="text-[10px] font-bold">LAB</span>
        </button>
        <button data-tab="squad" class="tab-btn flex flex-col items-center justify-center gap-1 text-gray-500">
          <i data-lucide="users" class="tab-icon w-6 h-6"></i>
          <span class="text-[10px] font-bold">SQUAD</span>
        </button>
        <button data-tab="intel" class="tab-btn flex flex-col items-center justify-center gap-1 text-gray-500">
          <i data-lucide="radar" class="tab-icon w-6 h-6"></i>
          <span class="text-[10px] font-bold">INTEL</span>
        </button>
        <button data-tab="you" class="tab-btn flex flex-col items-center justify-center gap-1 text-gray-500">
          <i data-lucide="user" class="tab-icon w-6 h-6"></i>
          <span class="text-[10px] font-bold">YOU</span>
        </button>
      </div>
    </nav>
  </div>

  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[200] flex flex-col gap-2 pointer-events-none w-[90%] max-w-sm"></div>
  <div id="modal-container" class="fixed inset-0 z-[150] hidden"></div>
  <div id="sheet-container" class="fixed inset-0 z-[150] hidden"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="/app.js"></script>
</body>
</html>
